name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

permissions:
  contents: write

concurrency:
  group: sync-from-cfnew-main
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 验证同步保护逻辑
        run: python3 -B .github/scripts/test_sync_release.py
      
      - name: 获取 cfnew 最新发布
        id: get_latest
        run: |
          set -euo pipefail
          LATEST_RELEASE=$(curl -fsSL --retry 3 https://api.github.com/repos/byJoey/cfnew/releases/latest)
          VERSION=$(jq -er '.tag_name | select(type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._+-]*$"))' <<< "$LATEST_RELEASE")
          DOWNLOAD_URL=$(jq -er '[.assets[] | select(.name == "Pages.zip") | .browser_download_url] | select(length == 1) | .[0] | select(startswith("https://github.com/byJoey/cfnew/releases/download/"))' <<< "$LATEST_RELEASE")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "file_name=Pages.zip" >> "$GITHUB_OUTPUT"
          echo "最新版本: $VERSION"
      
      - name: 检查当前版本
        id: check_version
        env:
          NEW_VERSION: ${{ steps.get_latest.outputs.version }}
        run: |
          # 读取当前记录的版本，如果文件不存在则创建空文件
          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(cat VERSION.txt | tr -d '\n\r ')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "版本记录文件为空，将进行首次更新"
            else
              echo "当前记录的版本: $CURRENT_VERSION"
            fi
          fi
          
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # 如果版本文件不存在或为空，或者版本不同，则需要更新
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将下载文件并创建版本记录"
            else
              echo "发现新版本 $CURRENT_VERSION -> $NEW_VERSION，需要更新"
            fi
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 设置 Node.js
        if: steps.check_version.outputs.need_update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装锁定的构建依赖
        if: steps.check_version.outputs.need_update == 'true'
        run: npm ci

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        env:
          DOWNLOAD_URL: ${{ steps.get_latest.outputs.download_url }}
          VERSION: ${{ steps.get_latest.outputs.version }}
        run: |
          set -euo pipefail
          SYNC_TMP=$(mktemp -d)
          trap 'rm -rf "$SYNC_TMP"' EXIT
          curl -fsSL --retry 3 -o "$SYNC_TMP/Pages.zip" "$DOWNLOAD_URL"
          python3 .github/scripts/sync-release.py "$SYNC_TMP/Pages.zip" "$VERSION" "$RUNNER_TEMP/upstream-paths"

      - name: 验证 Worker 打包
        if: steps.check_version.outputs.need_update == 'true'
        run: npm run check:deploy

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        env:
          VERSION: ${{ steps.get_latest.outputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git --literal-pathspecs add --pathspec-from-file="$RUNNER_TEMP/upstream-paths" --pathspec-file-nul
          
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew $VERSION"
            git push
            echo "已提交并推送更新"
          fi
      
      - name: 同步失败提示
        if: failure()
        run: |
          echo '## 同步未完成' >> "$GITHUB_STEP_SUMMARY"
          echo '请检查失败步骤：若有部署配置冲突或打包失败，应先检查上游兼容性，再重新运行。不要强制覆盖配置或强制推送。' >> "$GITHUB_STEP_SUMMARY"

      - name: 输出摘要
        env:
          LATEST_VERSION: ${{ steps.get_latest.outputs.version }}
          CURRENT_VERSION: ${{ steps.check_version.outputs.current_version }}
        run: |
          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "- 最新版本: $LATEST_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- 当前版本: $CURRENT_VERSION" >> "$GITHUB_STEP_SUMMARY"
          
          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新到新版本" >> $GITHUB_STEP_SUMMARY
            echo "- 下载文件: ${{ steps.get_latest.outputs.file_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ⏭️ 版本相同，无需更新" >> $GITHUB_STEP_SUMMARY
          fi
